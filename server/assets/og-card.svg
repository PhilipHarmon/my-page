<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Warm paper background (site 'paper' theme) -->
  <rect width="1200" height="630" fill="#faf5ec"/>
  <!-- Soft decorative blobs -->
  <circle cx="60" cy="30" r="190" fill="#f6eddb"/>
  <circle cx="1160" cy="620" r="210" fill="#f6eddb"/>
  <!-- Inner frame -->
  <rect x="24" y="24" width="1152" height="582" rx="18" fill="none" stroke="#e3d5bf" stroke-width="2"/>

  <!-- Page-and-pencil motif, echoing the favicon, on its cream tile -->
  <rect x="468" y="42" width="264" height="264" rx="58" fill="#fff6e9" stroke="#e3d5bf" stroke-width="2"/>
  <g transform="translate(478.8,54) scale(3.875)">
    <rect x="14" y="10" width="36" height="44" rx="4" fill="#fffdf7" stroke="#c75b21" stroke-width="3"/>
    <line x1="22" y1="22" x2="42" y2="22" stroke="#c75b21" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="31" x2="42" y2="31" stroke="#e8a33d" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="40" x2="34" y2="40" stroke="#c75b21" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 46 L52 34 L56 38 L44 50 L38 52 Z" fill="#16233c"/>
  </g>

  <!-- Headline -->
  <text x="600" y="428" text-anchor="middle" font-family="Noto Serif" font-weight="700" font-size="96" fill="#2b2118">My Page</text>

  <!-- Accent rule -->
  <rect x="540" y="452" width="120" height="6" rx="3" fill="#c75b21"/>

  <!-- Subtitle -->
  <text x="600" y="512" text-anchor="middle" font-family="Noto Serif" font-style="italic" font-size="34" fill="#7a6a58">Words, photos and videos — a personal page,</text>
  <text x="600" y="556" text-anchor="middle" font-family="Noto Serif" font-style="italic" font-size="34" fill="#7a6a58">designed and redesigned by its owner.</text>

  <!-- Credit, bottom-right corner (hourglass drawn as a vector: resvg has no color-emoji glyph for U+231B) -->
  <g transform="translate(793,569)" stroke="#c75b21" stroke-width="1.8" stroke-linejoin="round">
    <rect x="0" y="0" width="20" height="3.4" rx="1" fill="#c75b21" stroke="none"/>
    <rect x="0" y="16.6" width="20" height="3.4" rx="1" fill="#c75b21" stroke="none"/>
    <path d="M3.5 3.4 L16.5 3.4 L11 10 L16.5 16.6 L3.5 16.6 L9 10 Z" fill="#fff6e9"/>
  </g>
  <text x="1150" y="588" text-anchor="end" font-family="Noto Sans" font-size="23" fill="#7a6a58">Built by Stolen Hours Software</text>
</svg>
